<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gattini guerrieri 3D — by RAV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
 /* Schermata titolo (rifatta il 12 novembre 2026: «perché sia davvero bella e professionale»): una radura al tramonto, titolo d'oro inciso,
    entrata in scena a tempi, un solo pulsante. Tutto si adatta agli schermi stretti e rispetta «riduci movimento». */
 :root{--oro1:#fff4d0;--oro2:#f3c765;--oro3:#b97a1a;--inchiostro:#2a1907}
 html,body{margin:0;height:100%;overflow:hidden;background:#0a1210;font-family:'Cormorant Garamond',Georgia,serif;color:#fff3d6}
 #sfondo{position:fixed;inset:0;background:linear-gradient(180deg,#0b1626 0%,#1d3550 20%,#6a5a66 36%,#e2a063 47%,#f3c98a 52%,#5d6a45 60%,#182619 100%)}
 #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
 #raggi{position:fixed;inset:-20%;pointer-events:none;mix-blend-mode:screen;opacity:.33;
  background:repeating-linear-gradient(108deg,rgba(255,214,150,0) 0 5%,rgba(255,214,150,.55) 7%,rgba(255,214,150,0) 10% 17%);
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 28% 30%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse 60% 55% at 28% 30%,#000 0%,transparent 70%);animation:raggi 16s ease-in-out infinite alternate}
 @keyframes raggi{from{transform:translateX(-1.5%) rotate(-1deg)}to{transform:translateX(1.5%) rotate(1deg)}}
 #velatura{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 120% 95% at 50% 55%,rgba(0,0,0,0) 45%,rgba(3,6,5,.72) 100%),
  linear-gradient(180deg,rgba(6,10,14,.82) 0%,rgba(6,10,14,.35) 24%,rgba(6,10,14,0) 44%,rgba(6,10,14,0) 66%,rgba(5,8,6,.78) 100%)}
 #nero{position:fixed;inset:0;background:#060a08;pointer-events:none;z-index:9;transition:opacity 1.6s ease .15s}
 .pronto #nero{opacity:0}
 #titolo{position:fixed;left:0;right:0;top:clamp(26px,7vh,84px);text-align:center;perspective:1100px;pointer-events:none;padding:0 4vw}
 #scena-t{display:inline-block;transform-style:preserve-3d;transition:transform .35s ease-out}
 h1{margin:0;font-family:'Cinzel',Georgia,serif;font-weight:900;font-size:clamp(32px,5.9vw,92px);letter-spacing:.035em;line-height:1.02;transform-style:preserve-3d;text-wrap:balance}
 .parola{display:inline-block;white-space:nowrap;transform-style:preserve-3d}
 .l{position:relative;display:inline-block;transform-style:preserve-3d;transform-origin:50% 60%;animation:onda 6s ease-in-out infinite;animation-delay:calc(var(--i)*-.22s);
  transition:transform .5s cubic-bezier(.2,.9,.25,1.25),opacity .45s}
 .l::before{content:attr(data-l);position:absolute;left:0;top:0;z-index:-1;color:#3d2106;
  text-shadow:0 1px 0 #7d4a14,0 2px 0 #6a3d10,0 3px 0 #58320c,0 4px 0 #472809,0 10px 18px rgba(0,0,0,.75),0 0 46px rgba(255,170,70,.28)}
 .l span{background:linear-gradient(105deg,var(--oro1) 0%,var(--oro2) 30%,var(--oro3) 44%,#fffbe8 50%,var(--oro3) 56%,var(--oro2) 70%,var(--oro1) 100%);background-size:320% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:luce 9s ease-in-out infinite;animation-delay:calc(var(--i)*.07s)}
 .spazio{display:inline-block;width:.32em}
 /* il titolo «da gatto»: tre artigliate lo scoprono; ogni lettera, se la tocchi, salta come un gomitolo; ogni tanto un gatto invisibile ci cammina sotto */
 .l{pointer-events:auto;cursor:default}
 .l.colpo{animation:colpo .75s cubic-bezier(.3,1.5,.5,1)!important}
 @keyframes colpo{0%{transform:translateY(0) rotate(0)}28%{transform:translateY(-.3em) rotate(var(--r,14deg)) scale(1.12)}58%{transform:translateY(.05em) rotate(calc(var(--r,14deg)*-.45))}80%{transform:translateY(-.03em) rotate(calc(var(--r,14deg)*.15))}100%{transform:none}}
 #graffi{position:absolute;inset:-12% -6%;pointer-events:none;z-index:2}
 #graffi i{position:absolute;left:0;width:100%;height:.09em;font-size:clamp(32px,5.9vw,92px);border-radius:999px;transform-origin:0 50%;transform:rotate(-7deg) scaleX(0);opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 12%,#ffe9a8 45%,#ffb84a 80%,rgba(255,184,74,0));filter:drop-shadow(0 0 10px #ffb84a) drop-shadow(0 0 22px rgba(255,150,40,.7))}
 #graffi i:nth-child(1){top:24%} #graffi i:nth-child(2){top:50%} #graffi i:nth-child(3){top:76%}
 .pronto #graffi i{animation:graffio .95s cubic-bezier(.7,0,.2,1) forwards} .pronto #graffi i:nth-child(2){animation-delay:.09s} .pronto #graffi i:nth-child(3){animation-delay:.18s}
 @keyframes graffio{0%{transform:rotate(-7deg) scaleX(0);opacity:1}55%{transform:rotate(-7deg) scaleX(1);opacity:1}100%{transform:rotate(-7deg) scaleX(1) translateX(6%);opacity:0}}
 #orme{position:absolute;left:0;right:0;top:100%;height:0;pointer-events:none}
 #orme svg{position:absolute;width:clamp(13px,1.5vw,22px);height:clamp(13px,1.5vw,22px);fill:#f3c765;opacity:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8));animation:orma 3.2s ease-out forwards}
 @keyframes orma{0%{opacity:0;transform:scale(.4) rotate(var(--a))}12%{opacity:.85;transform:scale(1.1) rotate(var(--a))}22%{transform:scale(1) rotate(var(--a))}75%{opacity:.6}100%{opacity:0;transform:scale(1) rotate(var(--a))}}
 .fuori{transform:rotateX(90deg) translateY(-.2em)!important;opacity:0}
 .entra{transform:rotateX(-90deg) translateY(.25em)!important;opacity:0}
 @keyframes onda{0%,100%{transform:translateY(0)}50%{transform:translateY(-.028em)}}
 @keyframes luce{0%,62%{background-position:100% 0}88%,100%{background-position:0% 0}}
 #tre{display:inline-block;margin-left:.3em;font-family:'Cinzel',serif;font-weight:700;font-size:.4em;letter-spacing:.12em;vertical-align:.95em;padding:.2em .5em .14em;border-radius:.3em;
  color:var(--oro1);background:rgba(24,15,5,.55);border:1px solid rgba(243,199,101,.75);box-shadow:0 0 18px rgba(255,180,80,.35),inset 0 0 12px rgba(255,200,110,.18);text-shadow:0 1px 6px rgba(0,0,0,.8);
  transition:opacity .6s .9s,transform .6s .9s}
 body:not(.pronto) #tre{opacity:0;transform:scale(.7)}
 .filetto{display:flex;align-items:center;justify-content:center;gap:14px;margin:clamp(8px,1.6vh,18px) auto 0;width:min(520px,70vw);opacity:.95;transition:opacity .9s 1.1s,transform .9s 1.1s}
 .filetto i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(243,199,101,.85))} .filetto i:last-child{background:linear-gradient(270deg,transparent,rgba(243,199,101,.85))}
 .filetto svg{width:22px;height:22px;fill:var(--oro2);filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
 .sub{margin-top:clamp(6px,1.2vh,14px);font-style:italic;font-weight:500;font-size:clamp(17px,2.2vw,28px);color:#f4ead2;text-shadow:0 2px 12px rgba(0,0,0,.9);letter-spacing:.01em;transition:opacity .9s 1.25s,transform .9s 1.25s}
 .by{margin-top:clamp(8px,1.6vh,16px);font-family:'Cinzel',serif;font-weight:700;font-size:clamp(11px,1.15vw,15px);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#e9cf93;text-shadow:0 2px 10px #000;opacity:.9;transition:opacity .9s 1.4s}
 body:not(.pronto) .filetto,body:not(.pronto) .sub{opacity:0;transform:translateY(10px)} body:not(.pronto) .by{opacity:0}
 .flip{display:inline-block;transition:transform .35s cubic-bezier(.5,-0.4,.5,1.4),opacity .35s;transform-style:preserve-3d}
 #lingue{position:fixed;top:16px;right:18px;display:flex;gap:2px;background:rgba(8,14,12,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(243,199,101,.35);border-radius:999px;padding:4px;z-index:3;transition:opacity .8s 1.6s}
 body:not(.pronto) #lingue{opacity:0}
 #lingue button{border:0;background:transparent;color:#ecd9a9;font:600 13px system-ui,sans-serif;letter-spacing:.02em;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s}
 #lingue button:hover{color:#fff} #lingue button.si{background:linear-gradient(#ffeab0,#eab44c);color:var(--inchiostro)}
 #azione{position:fixed;left:0;right:0;bottom:clamp(54px,9vh,96px);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:3;transition:opacity .9s 1.7s,transform .9s 1.7s}
 body:not(.pronto) #azione{opacity:0;transform:translateY(16px)}
 #gioca{position:relative;border:0;cursor:pointer;padding:17px 58px 16px;border-radius:999px;overflow:hidden;
  font:900 clamp(20px,2.1vw,27px) 'Cinzel',serif;letter-spacing:.14em;text-indent:.14em;color:var(--inchiostro);background:linear-gradient(180deg,#fff0c0 0%,#f5c860 48%,#d9952b 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(120,70,10,.35),0 5px 0 #7c4f16,0 16px 36px rgba(0,0,0,.6),0 0 0 0 rgba(255,205,110,.5);
  transition:transform .18s,filter .18s;animation:respiro 3.2s ease-in-out infinite}
 #gioca::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:lampo 5.5s ease-in-out infinite}
 #gioca:hover{transform:translateY(-2px);filter:brightness(1.06)} #gioca:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 0 #7c4f16,0 8px 18px rgba(0,0,0,.6)}
 #gioca:focus-visible,#lingue button:focus-visible{outline:2px solid #fff;outline-offset:3px}
 @keyframes respiro{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(120,70,10,.35),0 5px 0 #7c4f16,0 16px 36px rgba(0,0,0,.6),0 0 0 0 rgba(255,205,110,.5)}55%{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(120,70,10,.35),0 5px 0 #7c4f16,0 16px 36px rgba(0,0,0,.6),0 0 0 16px rgba(255,205,110,0)}}
 @keyframes lampo{0%,70%{left:-60%}100%{left:130%}}
 #tasto{font:500 13px system-ui,sans-serif;color:#d9d0b4;opacity:.75;letter-spacing:.04em;text-shadow:0 1px 6px #000}
 #tasto kbd{font:600 12px system-ui,sans-serif;padding:2px 7px;border-radius:5px;border:1px solid rgba(255,235,190,.5);background:rgba(255,255,255,.08);margin:0 3px}
 #crediti{position:fixed;left:0;right:0;bottom:12px;text-align:center;font:11.5px system-ui,sans-serif;color:#aab6a4;opacity:.7;padding:0 16px;z-index:2}
 #crediti a{color:#e2cf9f;text-decoration:none;border-bottom:1px solid rgba(226,207,159,.4)}
 @media (max-width:640px){ #lingue{top:10px;right:10px} #lingue button{padding:6px 10px;font-size:12px} #titolo{top:64px} #tre{vertical-align:.8em} #tasto{display:none} }
 @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition-duration:.01s!important} }
</style>

<body>
<div id="sfondo"></div>
<canvas id="gl"></canvas>
<div id="raggi"></div>
<div id="velatura"></div>
<div id="lingue"><button data-lang="it" class="si">Italiano</button><button data-lang="en">English</button><button data-lang="fr">Français</button></div>
<div id="titolo"><div id="scena-t">
 <div style="position:relative;display:inline-block"><h1 id="h1"></h1><div id="graffi"><i></i><i></i><i></i></div><div id="orme"></div></div>
 <div class="filetto"><i></i><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15.5" rx="5.2" ry="4.3"/><ellipse cx="4.6" cy="10.6" rx="2.1" ry="2.8" transform="rotate(-18 4.6 10.6)"/><ellipse cx="9.2" cy="6.2" rx="2.1" ry="2.9" transform="rotate(-6 9.2 6.2)"/><ellipse cx="14.8" cy="6.2" rx="2.1" ry="2.9" transform="rotate(6 14.8 6.2)"/><ellipse cx="19.4" cy="10.6" rx="2.1" ry="2.8" transform="rotate(18 19.4 10.6)"/></svg><i></i></div>
 <div class="sub"><span class="flip" data-t="sub">Tre clan, un bosco, mille leggende</span></div>
 <div class="by"><span class="flip" data-t="by">di RAV · da un’idea di Dalia</span></div>
</div></div>
<div id="azione"><button id="gioca"><span class="flip" data-t="gioca">Gioca</span></button><div id="tasto"><span class="flip" data-t="tasto"></span></div></div>
<div id="nero"></div>
<div id="crediti"><span class="flip" data-t="cred">Modello del gatto: «Toon Cat FREE» di Omabuarts Studio, licenza</span> <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · 3D: three.js</div>
<script>
// il titolo: lettere d'oro in 3D che ondeggiano; cambiando lingua si ribaltano una a una (richiesta del 12 novembre 2026)
const TESTI={it:{h1:'Gattini guerrieri',by:'di RAV · da un’idea di Dalia',sub:'Tre clan, un bosco, mille leggende',gioca:'Gioca',tasto:'premi <kbd>Invio</kbd> per cominciare',cred:'Modello del gatto: «Toon Cat FREE» di Omabuarts Studio, licenza',pag:'gioco.html',lang:'it'},
 fr:{h1:'Chatons guerriers',by:'de RAV · d’après une idée de Dalia',sub:'Trois clans, une forêt, mille légendes',gioca:'Jouer',tasto:'appuie sur <kbd>Entrée</kbd> pour commencer',cred:'Modèle du chat : « Toon Cat FREE » d’Omabuarts Studio, licence',pag:'jeu.html',lang:'fr'},
 en:{h1:'Warrior Kittens',by:'by RAV · from an idea by Dalia',sub:'Three clans, one forest, a thousand legends',gioca:'Play',tasto:'press <kbd>Enter</kbd> to begin',cred:'Cat model: «Toon Cat FREE» by Omabuarts Studio, licence',pag:'game.html',lang:'en'}};
let lingua=({'#fr':'fr','#en':'en'})[location.hash]||'it'; // la home si apre in italiano; #fr e #en la aprono in francese o in inglese
const h1=document.getElementById('h1');
function lettere(t,cl){ let i=0; const parole=t.split(' ').map(w=>'<span class="parola">'+[...w].map(c=>`<span class="l ${cl||''}" style="--i:${i++}" data-l="${c}"><span>${c}</span></span>`).join('')+'</span>'); // le parole vanno a capo intere sugli schermi stretti
 return parole.slice(0,-1).map(p=>p+'<span class="spazio"></span>').join('')+'<span class="parola">'+parole[parole.length-1].replace(/^<span class="parola">|<\/span>$/g,'')+'<span id="tre">3D</span></span>'; }
function scrivi(L,anima){
 const T=TESTI[L]; document.documentElement.lang=T.lang;
 document.querySelectorAll('#lingue button').forEach(b=>b.classList.toggle('si',b.dataset.lang===L));
 if(!anima){ h1.innerHTML=lettere(T.h1); document.querySelectorAll('.flip').forEach(e=>e.innerHTML=T[e.dataset.t]); return; }
 const vecchie=[...h1.querySelectorAll('.l')];
 vecchie.forEach((e,i)=>setTimeout(()=>{ e.style.animation='none'; e.classList.add('fuori'); },i*45));
 document.querySelectorAll('.flip').forEach((e,i)=>setTimeout(()=>{ e.style.transform='rotateX(90deg)'; e.style.opacity=0; setTimeout(()=>{ e.innerHTML=T[e.dataset.t]; e.style.transform='rotateX(-90deg)'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ e.style.transform=''; e.style.opacity=1; })); },350); },120+i*90));
 setTimeout(()=>{ h1.innerHTML=lettere(T.h1,'entra'); [...h1.querySelectorAll('.l')].forEach((e,i)=>setTimeout(()=>e.classList.remove('entra'),40+i*45)); },vecchie.length*45+320);
}
scrivi(lingua,false);
// entrata in scena: le lettere salgono una a una, poi filetto, sottotitolo, pulsante (le regole sono nel CSS, sotto body.pronto)
[...h1.querySelectorAll('.l')].forEach(e=>e.classList.add('entra'));
const inScena=()=>{ if(document.body.classList.contains('pronto')) return; document.body.classList.add('pronto'); [...h1.querySelectorAll('.l')].forEach((e,i,A)=>setTimeout(()=>{ e.classList.remove('entra'); colpisci(e,0.5); },160+i/A.length*520)); setTimeout(orme,2600); setInterval(orme,15000); };
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setTimeout(inScena,120)); setTimeout(inScena,1800);
addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&!(e.target&&e.target.closest&&e.target.closest('#lingue'))){ e.preventDefault(); document.getElementById('gioca').click(); } });
document.querySelectorAll('#lingue button').forEach(b=>b.onclick=()=>{ if(b.dataset.lang===lingua) return; lingua=b.dataset.lang; scrivi(lingua,true); try{ history.replaceState(null,'',lingua==='it'?location.pathname:'#'+lingua); }catch(e){} });
document.getElementById('gioca').onclick=()=>{ location.href=TESTI[lingua].pag; };
// le lettere si colpiscono come un gomitolo: al passaggio del mouse (o al tocco) saltano e ruotano, e trascinano un po' le vicine
function colpisci(e,forza=1){ if(!e||e.classList.contains('colpo')||e.classList.contains('entra')||e.classList.contains('fuori')) return; e.style.setProperty('--r',((Math.random()<0.5?-1:1)*(8+Math.random()*14)*forza)+'deg'); e.classList.add('colpo'); setTimeout(()=>e.classList.remove('colpo'),760); }
h1.addEventListener('pointerover',e=>{ const l=e.target.closest&&e.target.closest('.l'); if(!l) return; colpisci(l); const A=[...h1.querySelectorAll('.l')], i=A.indexOf(l); setTimeout(()=>{ colpisci(A[i-1],0.45); colpisci(A[i+1],0.45); },70); });
// un gatto invisibile cammina sotto il titolo e lascia le orme
const ORMA='<svg viewBox="0 0 24 24"><ellipse cx="12" cy="15.5" rx="5.2" ry="4.3"/><ellipse cx="4.6" cy="10.6" rx="2.1" ry="2.8" transform="rotate(-18 4.6 10.6)"/><ellipse cx="9.2" cy="6.2" rx="2.1" ry="2.9" transform="rotate(-6 9.2 6.2)"/><ellipse cx="14.8" cy="6.2" rx="2.1" ry="2.9" transform="rotate(6 14.8 6.2)"/><ellipse cx="19.4" cy="10.6" rx="2.1" ry="2.8" transform="rotate(18 19.4 10.6)"/></svg>';
function orme(){ const box=document.getElementById('orme'); if(!box||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches) return; const verso=Math.random()<0.5?1:-1, n=12;
 for(let k=0;k<n;k++) setTimeout(()=>{ const d=document.createElement('div'); d.innerHTML=ORMA; const s=d.firstChild, x=verso>0?4+k*(92/n):96-k*(92/n); s.style.left=x+'%'; s.style.top=((k%2)?10:-4)+'px'; s.style.setProperty('--a',(verso>0?90:-90)+'deg'); box.appendChild(s); setTimeout(()=>s.remove(),3300);
  const A=[...h1.querySelectorAll('.l')]; if(k%3===1) colpisci(A[Math.floor(x/100*A.length)],0.35); },k*230); }
// il titolo si inclina seguendo il mouse
const st=document.getElementById('scena-t');
addEventListener('pointermove',e=>{ const x=e.clientX/innerWidth-0.5, y=e.clientY/innerHeight-0.5; st.style.transform=`rotateY(${x*10}deg) rotateX(${-y*7}deg)`; });
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
// la radura del titolo: gattini che si allenano alla guerra, il capo che chiama dalla roccia, una sentinella, un cacciatore
try{
 const cv=document.getElementById('gl');
 const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(34,1,0.05,60);
 scene.fog=new THREE.Fog('#59553c',3.6,12.5); // foschia calda: gli alberi lontani si perdono nella luce della sera
 scene.add(new THREE.HemisphereLight('#ffe2bd','#26402c',1.25));
 const sole=new THREE.DirectionalLight('#ffb463',3.6); sole.position.set(-3.4,2.3,-2.2); sole.castShadow=true; sole.shadow.mapSize.set(2048,2048); sole.shadow.bias=-0.0006; // sole basso, di tre quarti da dietro: contorni dorati e ombre lunghe
 const riempi=new THREE.DirectionalLight('#8fb4ff',0.55); riempi.position.set(2.5,2,3.5); scene.add(riempi); // un filo di luce fredda davanti, perché i musi non restino neri
 Object.assign(sole.shadow.camera,{left:-3,right:3,top:3,bottom:-3}); scene.add(sole);
 const R=(()=>{ let x=7; return ()=>((x=(x*16807)%2147483647)/2147483647); })();
 const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});
